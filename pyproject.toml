[project]
name = "carol-anne"
version = "0.1.0"
description = "A small convolutional neural network template"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ceven Jupiter Knowles", email = "160178756+CevenJKnowles@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "panns-inference>=0.1.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "fastapi>=0.141.1",
    "librosa>=1.0.0",
    "matplotlib>=3.11.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "nbformat>=5.11.1",
    "plotly>=7.0.0",
    "umap-learn>=0.5.12",
]
